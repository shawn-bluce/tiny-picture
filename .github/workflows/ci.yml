name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an older build (so the nightly
# release is never overwritten by an older commit). Tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Check, test and bundle
    # Apple silicon runner; the app is arm64-only.
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build-number: ${{ steps.meta.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the build number is the commit count.
          fetch-depth: 0

      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Show toolchain
        run: rustup show active-toolchain && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Version info
        id: meta
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Bundle
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.build-number }}
        run: ./scripts/bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-picture
          path: target/bundle/*.zip
          if-no-files-found: error
          retention-days: 30

  nightly:
    name: Publish nightly build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tiny-picture
          path: dist

      - name: Replace the nightly release
        run: |
          # A fixed file name keeps the download link stable.
          mv dist/*.zip dist/Tiny-Picture-nightly-arm64.zip
          cat > notes.md <<EOF
          Latest build of the \`master\` branch. It may contain unreleased changes.

          - Version: $VERSION (build $BUILD_NUMBER)
          - Commit: $GITHUB_SHA

          The app is not notarized. See the README for how to open it the first time.
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/Tiny-Picture-nightly-arm64.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes-file notes.md

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tiny-picture
          path: dist

      - name: Create the GitHub release
        run: |
          # Release notes are the CHANGELOG section of this version.
          awk -v heading="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          printf '\nThe app is not notarized. See the README for how to open it the first time.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "Tiny Picture $VERSION" \
            --notes-file notes.md
